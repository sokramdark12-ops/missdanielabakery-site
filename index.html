<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Desayunos - Mi Emprendimiento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Calculadora de Desayunos Artesanales</h2>
    <p>Personalizá tu bandeja y calculá el presupuesto al instante.</p>

    <div class="calculadora">
        <!-- SELECCIÓN DE BANDEJA -->
        <label for="tipoBandeja">Seleccioná tu tipo de bandeja:</label>
        <select id="tipoBandeja" onchange="mostrarOpciones()">
            <option value="0">-- Elegir --</option>
            <option value="45000" data-tipo="sweet">Desayuno Sweet ($45.000)</option>
            <option value="45000" data-tipo="salado">Desayuno Salado ($45.000)</option>
            <option value="50000" data-tipo="mixto">Desayuno Mixto ($50.000)</option>
            <option value="65000" data-tipo="premium">Bandeja Premium ($65.000)</option>
        </select>

        <hr>

        <!-- CONTENEDOR DINÁMICO DE OPCIONES -->
        <div id="opcionesDetalle" style="display:none;">
            <div id="grupo-sweet" class="grupo-opcion">
                <h4>Opciones Dulces:</h4>
                <p>Budín:</p>
                <select class="item-desayuno" data-base="Budín">
                    <option value="Banana con Chips">Banana con Chips</option>
                    <option value="Marmolado">Marmolado</option>
                    <option value="Naranja">Naranja</option>
                    <option value="Limón">Limón</option>
                </select>

                <p>Porción Dulce:</p>
                <select class="item-desayuno" data-base="Porción">
                    <option value="Frola Membrillo">Pastafrola Membrillo</option>
                    <option value="Frola Batata">Pastafrola Batata</option>
                    <option value="Crumble de Manzana" data-extra="2000">Crumble de Manzana (+$2.000)</option>
                </select>

                <p>Alfajor:</p>
                <select class="item-desayuno" data-base="Alfajor">
                    <option value="Marroc">Dulce de Leche y Marroc</option>
                    <option value="Fruta">Fruta y Glaseado</option>
                    <option value="Patagónico" data-extra="1000">Patagónico (+$1.000)</option>
                </select>
            </div>

            <div id="grupo-salado" class="grupo-opcion">
                <h4>Opciones Saladas:</h4>
                <p>Chipá:</p>
                <select class="item-desayuno" data-base="Chipá">
                    <option value="Clásico">4 Chipá Clásicos</option>
                    <option value="Mixto" data-extra="2000">4 Chipá Mixtos J&Q (+$2.000)</option>
                </select>

                <p>Sándwich:</p>
                <select class="item-desayuno" data-base="Sándwich">
                    <option value="Jamón y Queso">Jamón Natural y Queso</option>
                    <option value="Salame y Queso">Salame y Queso</option>
                    <option value="Jamón Crudo" data-extra="2000">Jamón Crudo y Queso (+$2.000)</option>
                </select>
            </div>
            
            <div class="personalizacion">
                <h4>Personalización:</h4>
                <input type="text" id="textoTaza" placeholder="Nombre/Frase para la taza o chop">
            </div>
        </div>

        <div class="resumen">
            <h3>Total: <span id="totalVisual">$0</span></h3>
            <p><small>* Los pedidos se señan con el 50%.</small></p>
            <button onclick="enviarWhatsApp()">Enviar Pedido por WhatsApp</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
