<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miss Daniela Bakery - Pedidos de Pascuas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #FDF6EE; --surface: #FFFFFF; --text: #3E2718; --accent: #A8552F; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; scroll-behavior: smooth; }
    .font-display { font-family: 'Playfair Display', serif; }
    
    /* Notificación Toast */
    .toast { 
      position: fixed; top: 20px; right: 20px; 
      transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 1000; display: flex; align-items: center; gap: 10px;
    }
    .toast.show { transform: translateX(0); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .cart-badge { position: absolute; top: -8px; right: -8px; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body class="h-full">
  <div id="toast" class="toast bg-white border-l-4 border-green-500 shadow-2xl p-4 rounded-xl">
    <div class="bg-green-100 p-1 rounded-full text-green-600"><i data-lucide="check" style="width:18px;"></i></div>
    <span id="toast-msg" class="font-bold text-sm">¡Producto agregado!</span>
  </div>

  <div id="app" class="h-full w-full overflow-auto">
    <header class="sticky top-0 z-50 shadow-sm" style="background: rgba(62,39,24,0.98); color: white;">
      <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-3xl">🥚</span>
          <h1 class="font-display text-lg font-bold">Miss Daniela Bakery</h1>
        </div>
        <button onclick="toggleCart()" class="relative p-2 rounded-xl" style="background: var(--accent);">
          <i data-lucide="shopping-cart"></i>
          <span id="cart-badge" class="cart-badge" style="background: white; color: var(--accent);">0</span>
        </button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 pb-32 space-y-16">
      <section id="step-1">
        <h2 class="font-display text-2xl font-bold mb-4">1️⃣ Elegí el tamaño 📏</h2>
        <div id="sizes-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3"></div>
      </section>

      <section id="step-2">
        <h2 class="font-display text-2xl font-bold mb-4">2️⃣ Elegí la temática 🎨</h2>
        <div id="themes-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
        <div id="add-egg-section" class="mt-6 hidden p-6 rounded-2xl bg-white shadow-md border-2 border-[#A8552F]">
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div><p id="selected-summary" class="font-bold">-</p><p id="selected-price" class="text-xl font-bold text-[#A8552F]">-</p></div>
            <button onclick="addToCart()" class="w-full sm:w-auto px-10 py-4 rounded-xl font-bold text-white shadow-lg" style="background: var(--accent);">Agregar Huevo Tradicional 🛒</button>
          </div>
        </div>
      </section>

      <section id="step-3">
        <h2 class="font-display text-2xl font-bold mb-4">3️⃣ Figuras Especiales ✨</h2>
        <div id="specials-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      </section>

      <section id="step-4">
        <h2 class="font-display text-2xl font-bold mb-4">4️⃣ Huevos Corporativos 🏢</h2>
        <div id="corporate-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      </section>

      <section id="step-5">
        <h2 class="font-display text-2xl font-bold mb-4">5️⃣ Rosca de Pascuas 🧁</h2>
        <div id="rosca-container"></div>
      </section>
    </main>

    <div id="cart-modal" class="modal-overlay" onclick="if(event.target===this)toggleCart()">
      <div class="bg-white w-full max-w-md m-4 rounded-3xl p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
        <h3 class="font-display text-2xl font-bold mb-6">Tu Pedido 🧺</h3>
        <div id="cart-items" class="space-y-4 mb-6"></div>
        
        <div class="space-y-4 mb-6 bg-gray-50 p-4 rounded-2xl">
          <div>
            <label class="block text-xs font-bold mb-1 uppercase opacity-60">Tu Nombre Completo:</label>
            <input type="text" id="user-name" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#A8552F] outline-none" placeholder="Escribí tu nombre aquí...">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1 uppercase opacity-60">Notas / Personalización:</label>
            <textarea id="order-notes" rows="2" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#A8552F] outline-none" placeholder="Ej: Nombre para el huevo Dino..."></textarea>
          </div>
        </div>

        <div class="border-t pt-4">
          <div class="flex justify-between items-center mb-6">
            <span class="font-bold text-lg">Total Pedido:</span>
            <span id="cart-total" class="text-3xl font-bold text-[#A8552F]">$0</span>
          </div>
          <button onclick="sendWhatsApp()" class="w-full py-5 rounded-2xl text-white font-bold flex items-center justify-center gap-3 text-lg shadow-xl" style="background: #25D366;">
            <i data-lucide="message-circle"></i> Enviar por WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Datos y Configuración
    const SIZES = [
      { id: 'n8', label: 'N° 8', desc: '70g', price: 4500 },
      { id: 'n10', label: 'N° 10', desc: '110g', price: 6600 },
      { id: 'n11', label: 'N° 11', desc: '150g', price: 7700 },
      { id: 'n12', label: 'N° 12', desc: '200g', price: 9800 },
      { id: 'n15', label: 'N° 15', desc: '300g', price: 15500 },
      { id: 'n18', label: 'N° 18', desc: '500g', price: 21500 }
    ];

    const THEMES = [
      { id: 'dino', label: 'Dinosaurios', emoji: '🦕' },
      { id: 'super', label: 'Superhéroes', emoji: '🦸' },
      { id: 'starwars', label: 'Star Wars', emoji: '⚔️' },
      { id: 'floral', label: 'Florales', emoji: '🌸' },
      { id: 'personajes', label: 'Personajes', emoji: '🎭' },
      { id: 'futbol', label: 'Fútbol', emoji: '⚽' },
      { id: 'animales', label: 'Animales', emoji: '🐱' },
      { id: 'otro', label: 'Especial/Foto', emoji: '📷' }
    ];

    let cart = [];
    let selectedSize = null;
    let selectedTheme = null;

    function render() {
      // Tamaños
      document.getElementById('sizes-grid').innerHTML = SIZES.map(s => `
        <div onclick="selectSize('${s.id}')" class="p-4 rounded-2xl cursor-pointer text-center transition-all ${selectedSize === s.id ? 'bg-[#A8552F] text-white shadow-lg scale-105' : 'bg-white shadow-sm hover:bg-orange-50'}">
          <p class="font-bold text-sm">${s.label}</p><p class="text-xs opacity-70">$${s.price.toLocaleString()}</p>
        </div>
      `).join('');

      // Temáticas
      document.getElementById('themes-grid').innerHTML = THEMES.map(t => `
        <div onclick="selectTheme('${t.id}')" class="p-4 rounded-2xl cursor-pointer text-center transition-all ${selectedTheme === t.id ? 'bg-[#A8552F] text-white shadow-lg scale-105' : 'bg-white shadow-sm hover:bg-orange-50'}">
          <span class="text-2xl">${t.emoji}</span><p class="font-bold text-[10px] mt-2">${t.label}</p>
        </div>
      `).join('');

      // Especiales
      document.getElementById('specials-grid').innerHTML = [
        { name: 'Capibara', price: 15000, emoji: '🐹' },
        { name: 'Copa del Mundo', price: 15000, emoji: '🏆' },
        { name: 'Joystick Gamer', price: 13000, emoji: '🎮' }
      ].map(sp => `
        <div class="bg-white p-5 rounded-2xl flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-3"><span>${sp.emoji}</span><p class="font-bold text-sm">${sp.name} ($${sp.price.toLocaleString()})</p></div>
          <button onclick="addGenericToCart('${sp.name}', ${sp.price}, '${sp.emoji}')" class="p-2 rounded-lg bg-[#A8552F] text-white"><i data-lucide="plus"></i></button>
        </div>
      `).join('');

      // Corporativos
      document.getElementById('corporate-grid').innerHTML = [
        { label: 'N° 20', price: 32000 },
        { label: 'N° 25', price: 46000 },
        { label: 'N° 30', price: 67000 }
      ].map(c => `
        <div class="bg-white p-4 rounded-2xl text-center shadow-sm">
          <p class="font-bold text-sm">Huevo ${c.label}</p><p class="text-[#A8552F] font-bold mb-3">$${c.price.toLocaleString()}</p>
          <button onclick="addGenericToCart('Corp. ${c.label}', ${c.price}, '🏢')" class="w-full py-2 rounded-xl bg-gray-100 text-xs font-bold hover:bg-[#A8552F] hover:text-white transition-colors">Agregar</button>
        </div>
      `).join('');

      // Rosca (PASO FINAL)
      document.getElementById('rosca-container').innerHTML = `
        <div class="bg-white p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-md border-t-4 border-[#A8552F]">
          <div class="flex items-center gap-4"><span class="text-4xl">🧁</span>
            <div><p class="font-bold text-lg">Rosca Tradicional Artesanal</p><p class="text-sm opacity-60">¡El último paso para tu Pascua!</p></div>
          </div>
          <button onclick="addGenericToCart('Rosca de Pascuas', 10000, '🧁', true)" class="px-8 py-4 rounded-2xl text-white font-bold shadow-lg" style="background: var(--accent);">$10.000 Agregar y Finalizar</button>
        </div>
      `;
      lucide.createIcons();
    }

    // Funciones de Car
